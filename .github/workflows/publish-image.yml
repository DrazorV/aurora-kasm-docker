name: Publish Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish in addition to sha/tag tags
        required: true
        default: latest

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute image name
        id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=${REGISTRY}/${owner}/aurora-kasm" >> "$GITHUB_OUTPUT"

      - name: Decode Aurora installer from secret
        env:
          AURORA_MSI_BASE64: ${{ secrets.AURORA_MSI_BASE64 }}
        run: |
          if [[ -z "${AURORA_MSI_BASE64}" ]]; then
            echo "AURORA_MSI_BASE64 secret is required." >&2
            exit 1
          fi

          umask 077
          printf '%s' "${AURORA_MSI_BASE64}" | base64 --decode > "assets/Aurora Setup.msi"

          if [[ ! -s "assets/Aurora Setup.msi" ]]; then
            echo "Decoded installer is empty." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=sha,format=short
            type=ref,event=tag

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Remove transient installer
        if: always()
        run: rm -f "assets/Aurora Setup.msi"
