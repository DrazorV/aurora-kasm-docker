name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Validate Compose
        env:
          AURORA_DATA_PATH: /tmp/aurora-data
        run: docker compose config --quiet

      - name: Confirm proprietary payloads are absent
        run: |
          mapfile -t unexpected_msi_files < <(
            git ls-files \
              | grep -Ei '\.msi$' \
              | grep -Ev '^assets/Aurora Setup\.msi$' || true
          )

          if ((${#unexpected_msi_files[@]} > 0)); then
            echo "Unexpected committed MSI files:"
            printf ' - %s\n' "${unexpected_msi_files[@]}"
            exit 1
          fi

          mapfile -t unexpected_font_files < <(
            git ls-files \
              | grep '^assets/fonts/' \
              | grep -Ev '^assets/fonts/(README\.md|SEGUISYM\.TTF)$' || true
          )

          if ((${#unexpected_font_files[@]} > 0)); then
            echo "Unexpected committed files under assets/fonts/:"
            printf ' - %s\n' "${unexpected_font_files[@]}"
            exit 1
          fi
