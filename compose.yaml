x-aurora-common: &aurora-common
  image: "${AURORA_IMAGE:-ghcr.io/drazorv/aurora-kasm:latest}"
  restart: unless-stopped
  environment:
    TZ: "${TZ:-Europe/Athens}"
    FREETYPE_PROPERTIES: "truetype:interpreter-version=35"
  volumes:
    - type: bind
      source: "${AURORA_DATA_PATH:?Set AURORA_DATA_PATH in .env}"
      target: /data/aurora
  shm_size: "1gb"
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
  security_opt:
    - no-new-privileges:true

services:
  aurora:
    <<: *aurora-common
    container_name: aurora
    ports:
      - "${AURORA_BIND_IP:-0.0.0.0}:${AURORA_PORT:-8444}:8444"
    volumes:
      - type: bind
        source: "${AURORA_DATA_PATH:?Set AURORA_DATA_PATH in .env}"
        target: /data/aurora
      - aurora-config:/config

volumes:
  aurora-config:
